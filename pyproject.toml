[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "declip"
version = "1.0.0"
description = "DE-CLIP: Description-Enhanced CLIP for zero-shot dermatology image classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "open_clip_torch==2.29.0",
    "timm>=1.0",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "black>=24.0", "pre-commit>=3.0"]
generate = ["openai>=1.30"]

[project.scripts]
declip = "declip.run:main"

[tool.setuptools.packages.find]
include = ["declip*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N806", "N803", "N812"]  # tensors named after paper symbols (L, D, T)

[tool.ruff.lint.per-file-ignores]
"tools/generate_descriptions.py" = ["E501"]  # the LLM prompt is quoted verbatim from the paper

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU and the cached embeddings"]
